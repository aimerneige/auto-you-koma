<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 水墨中国风</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'ZCOOL XiaoWei', serif;
      background: #f5f0e6;
      min-height: 100vh;
      position: relative;
    }

    /* Rice Paper Texture */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.08;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header - Chinese Seal Style */
    header {
      text-align: center;
      margin-bottom: 50px;
      padding: 30px;
      position: relative;
    }

    header::before, header::after {
      content: '～';
      position: absolute;
      top: 50%;
      font-size: 2rem;
      color: #8b4513;
      opacity: 0.5;
    }

    header::before { left: 10%; }
    header::after { right: 10%; }

    .logo {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 3rem;
      color: #2d1b0e;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      letter-spacing: 8px;
    }

    .seal {
      display: inline-block;
      width: 50px;
      height: 50px;
      background: #c41e3a;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      line-height: 50px;
      border-radius: 4px;
      margin-left: 15px;
      vertical-align: middle;
      font-family: 'Ma Shan Zheng', cursive;
    }

    .tagline {
      font-size: 1rem;
      color: #6b5344;
      margin-top: 10px;
      letter-spacing: 4px;
    }

    /* Steps - Ink Style */
    .steps {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 50px;
    }

    .step {
      padding: 15px 30px;
      position: relative;
      cursor: pointer;
    }

    .step::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background: #c41e3a;
      transition: width 0.3s ease;
    }

    .step:hover::after, .step.active::after {
      width: 60%;
    }

    .step-num {
      display: block;
      font-size: 0.75rem;
      color: #8b4513;
      margin-bottom: 5px;
    }

    .step-name {
      font-size: 1rem;
      color: #2d1b0e;
    }

    .step.active .step-name {
      color: #c41e3a;
      font-weight: bold;
    }

    .step-arrow {
      display: flex;
      align-items: center;
      color: #8b4513;
      opacity: 0.5;
      font-size: 1.2rem;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
    }

    /* Panels - Scroll Style */
    .panel {
      background: #fff;
      border-radius: 4px;
      padding: 30px;
      position: relative;
      box-shadow:
        0 4px 20px rgba(0,0,0,0.1),
        inset 0 0 50px rgba(139,69,19,0.03);
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid #d4c4a8;
      pointer-events: none;
    }

    .panel-title {
      font-size: 1.4rem;
      color: #2d1b0e;
      margin-bottom: 25px;
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 2px solid #d4c4a8;
    }

    /* Form */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #6b5344;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: #faf7f2;
      border: 1px solid #d4c4a8;
      border-radius: 2px;
      color: #2d1b0e;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #c41e3a;
      background: #fff;
    }

    textarea { min-height: 100px; resize: vertical; }

    /* Ink Brush Options */
    .style-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .style-opt {
      padding: 10px 18px;
      background: #faf7f2;
      border: 1px solid #d4c4a8;
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .style-opt:hover {
      border-color: #8b4513;
    }

    .style-opt.selected {
      background: #2d1b0e;
      color: #f5f0e6;
      border-color: #2d1b0e;
    }

    /* Buttons */
    .btn {
      padding: 14px 35px;
      font-family: inherit;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #c41e3a;
      color: #fff;
    }

    .btn-primary:hover {
      background: #a01830;
    }

    .btn-secondary {
      background: transparent;
      color: #6b5344;
      border: 1px solid #d4c4a8;
    }

    .btn-secondary:hover {
      border-color: #2d1b0e;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    /* Preview - Ink Painting */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .comic-panel {
      aspect-ratio: 9/16;
      background:
        linear-gradient(135deg, #faf7f2 0%, #e8dfd0 100%);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid #d4c4a8;
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.8rem;
      color: #6b5344;
    }

    /* Ink Style Bubble */
    .ink-bubble {
      position: absolute;
      background: #2d1b0e;
      color: #f5f0e6;
      padding: 12px 16px;
      font-size: 0.8rem;
      max-width: 80%;
    }

    .ink-bubble-left {
      left: 8%;
      top: 25%;
      border-radius: 0 20px 20px 20px;
    }

    .ink-bubble-right {
      right: 8%;
      bottom: 25%;
      border-radius: 20px 0 20px 20px;
    }

    /* Seal Stamp Status */
    .status-seal {
      margin-top: 20px;
      padding: 15px;
      background: #faf7f2;
      border: 2px solid #d4c4a8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .seal-small {
      width: 35px;
      height: 35px;
      background: #c41e3a;
      color: #fff;
      font-size: 0.7rem;
      text-align: center;
      line-height: 35px;
      border-radius: 3px;
    }

    .status-text {
      font-size: 0.9rem;
      color: #6b5344;
    }

    .progress-track {
      width: 150px;
      height: 6px;
      background: #e8dfd0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #c41e3a;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Decorative */
    .ink-splash {
      position: absolute;
      font-size: 3rem;
      opacity: 0.1;
      color: #2d1b0e;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .steps { flex-wrap: wrap; gap: 10px; }
      .step-arrow { display: none; }
      .btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <header>
      <h1 class="logo">
        自动四格漫画
        <span class="seal">印</span>
      </h1>
      <p class="tagline">水墨意境 · 传统美学</p>
    </header>

    <div class="steps">
      <div class="step active">
        <span class="step-num">壹</span>
        <span class="step-name">构思</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">贰</span>
        <span class="step-name">分镜</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">叁</span>
        <span class="step-name">绘卷</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">肆</span>
        <span class="step-name">完成</span>
      </div>
    </div>

    <div class="main-content">
      <div class="panel input-panel">
        <h2 class="panel-title">输入故事设定</h2>

        <div class="form-group">
          <label>故事主题</label>
          <input type="text" placeholder="如：山水意境、古风校园...">
        </div>

        <div class="form-group">
          <label>人物设定</label>
          <input type="text" placeholder="角色的外观与性格特征">
        </div>

        <div class="form-group">
          <label>剧情简述</label>
          <textarea placeholder="简述故事情节..."></textarea>
        </div>

        <div class="form-group">
          <label>画风选择</label>
          <div class="style-options">
            <span class="style-opt selected">水墨画</span>
            <span class="style-opt">工笔画</span>
            <span class="style-opt">写意画</span>
            <span class="style-opt">年画</span>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary">生成</button>
          <button class="btn btn-secondary">重置</button>
        </div>
      </div>

      <div class="panel preview-panel">
        <h2 class="panel-title">预览</h2>

        <div class="preview-grid">
          <div class="comic-panel">
            <span class="panel-label">第一格</span>
            <div class="ink-bubble ink-bubble-left">你好呀</div>
          </div>
          <div class="comic-panel">
            <span class="panel-label">第二格</span>
            <div class="ink-bubble ink-bubble-right">早安</div>
          </div>
          <div class="comic-panel">
            <span class="panel-label">第三格</span>
          </div>
          <div class="comic-panel">
            <span class="panel-label">第四格</span>
          </div>
        </div>

        <div class="status-seal">
          <div class="seal-small">生成中</div>
          <span class="status-text">正在渲染第 3 格...</span>
          <div class="progress-track">
            <div class="progress-fill" style="width: 60%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.style-opt').forEach(opt => {
      opt.addEventListener('click', function() {
        document.querySelectorAll('.style-opt').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
      });
    });

    let progress = 0;
    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 4;
        if (progress > 100) progress = 100;
        document.querySelector('.progress-fill').style.width = progress + '%';
      }
    }, 400);
  </script>
</body>
</html>
