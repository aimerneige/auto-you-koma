<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 浮窗面板布局</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      color: #212529;
      line-height: 1.5;
      overflow: hidden;
    }

    /* Desktop Canvas */
    .desktop {
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      position: relative;
    }

    /* Floating Panels */
    .window {
      position: absolute;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }

    .window:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.04);
    }

    .window-header {
      height: 40px;
      background: #fff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      cursor: grab;
    }

    .window-header:active {
      cursor: grabbing;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .window-dot.red { background: #ff5f56; }
    .window-dot.yellow { background: #ffbd2e; }
    .window-dot.green { background: #27ca3f; }

    .window-title {
      font-size: 0.6875rem;
      font-weight: 500;
      color: #868e96;
    }

    .window-body {
      padding: 16px;
    }

    /* Main Window - Comic Preview */
    .window-main {
      top: 60px;
      left: 60px;
      width: 600px;
      height: 500px;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      height: calc(100% - 60px);
    }

    .comic-panel {
      background: #f1f3f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .comic-panel:hover {
      background: #e9ecef;
    }

    .panel-number {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 0.625rem;
      font-weight: 600;
      color: #adb5bd;
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Dialogs */
    .dialog {
      position: absolute;
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .dialog-left {
      left: 8px;
      top: 25%;
    }

    .dialog-right {
      right: 8px;
      bottom: 25%;
    }

    /* Progress bar in main window */
    .window-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #e9ecef;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label {
      font-size: 0.6875rem;
      color: #868e96;
    }

    .progress-value {
      font-size: 0.6875rem;
      font-weight: 600;
    }

    .progress-track {
      height: 3px;
      background: #e9ecef;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #212529;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Settings Window */
    .window-settings {
      top: 60px;
      right: 60px;
      width: 320px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.625rem;
      font-weight: 600;
      color: #868e96;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      color: #212529;
      font-size: 0.8125rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #212529;
      background: #fff;
    }

    textarea {
      min-height: 60px;
      resize: none;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .radio-option {
      padding: 8px 12px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option:hover {
      border-color: #adb5bd;
    }

    .radio-option.selected {
      background: #212529;
      color: #fff;
      border-color: #212529;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: #212529;
      color: #fff;
    }

    .btn-primary:hover {
      background: #343a40;
    }

    .btn-secondary {
      background: #f8f9fa;
      color: #495057;
      border: 1px solid #e9ecef;
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    /* Characters Window */
    .window-characters {
      bottom: 60px;
      right: 60px;
      width: 280px;
      max-height: 300px;
    }

    .char-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .char-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-item:hover {
      background: #e9ecef;
    }

    .char-avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .char-avatar.c1 { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); }
    .char-avatar.c2 { background: linear-gradient(135deg, #4ecdc4 0%, #3db9b1 100%); }
    .char-avatar.c3 { background: linear-gradient(135deg, #ffe66d 0%, #f7d154 100%); }

    .char-info {
      flex: 1;
    }

    .char-name {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .char-desc {
      font-size: 0.625rem;
      color: #868e96;
    }

    /* Timeline Window */
    .window-timeline {
      bottom: 60px;
      left: 60px;
      width: 400px;
    }

    .timeline-track {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .timeline-item {
      flex: 1;
      height: 40px;
      background: #f8f9fa;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .timeline-item:hover {
      background: #e9ecef;
    }

    .timeline-item.active {
      background: #212529;
    }

    .timeline-item .panel-num {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.5625rem;
      font-weight: 600;
      color: #868e96;
    }

    .timeline-item.active .panel-num {
      color: #fff;
    }

    .timeline-item.done::after {
      content: '';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      background: #27ca3f;
      border-radius: 50%;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .timeline-title {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .timeline-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #868e96;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: #f8f9fa;
      color: #212529;
    }

    /* Desktop Icons */
    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 64px;
    }

    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .desktop-icon-img {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .desktop-icon-img svg {
      width: 18px;
      height: 18px;
      color: #fff;
    }

    .desktop-icon-label {
      font-size: 0.5625rem;
      color: #495057;
      text-align: center;
    }

    /* Dock */
    .dock {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .dock-item {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #495057;
    }

    .dock-item:hover {
      background: #f8f9fa;
      transform: translateY(-4px);
    }

    .dock-item.active {
      background: #212529;
      color: #fff;
    }

    .dock-item svg {
      width: 20px;
      height: 20px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .window-main {
        width: calc(100% - 120px);
        left: 20px;
        top: 20px;
      }

      .window-settings {
        right: 20px;
        top: 20px;
      }

      .window-timeline {
        left: 20px;
        bottom: 80px;
      }

      .window-characters {
        right: 20px;
        bottom: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <!-- Desktop Icons -->
    <div class="desktop-icons">
      <div class="desktop-icon">
        <div class="desktop-icon-img">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <span class="desktop-icon-label">Projects</span>
      </div>
    </div>

    <!-- Main Window - Comic Preview -->
    <div class="window window-main" id="mainWindow">
      <div class="window-header">
        <div class="window-controls">
          <span class="window-dot red"></span>
          <span class="window-dot yellow"></span>
          <span class="window-dot green"></span>
        </div>
        <span class="window-title">Preview - 四格漫画</span>
        <div style="width: 50px;"></div>
      </div>
      <div class="window-body">
        <div class="comic-grid">
          <div class="comic-panel">
            <span class="panel-number">01</span>
            <div class="dialog dialog-left">你好呀</div>
          </div>
          <div class="comic-panel">
            <span class="panel-number">02</span>
            <div class="dialog dialog-right">早安~</div>
          </div>
          <div class="comic-panel">
            <span class="panel-number">03</span>
          </div>
          <div class="comic-panel">
            <span class="panel-number">04</span>
          </div>
        </div>
      </div>
      <div class="window-progress">
        <div class="progress-header">
          <span class="progress-label">生成进度</span>
          <span class="progress-value">2/4 panels</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" style="width: 50%"></div>
        </div>
      </div>
    </div>

    <!-- Settings Window -->
    <div class="window window-settings">
      <div class="window-header">
        <div class="window-controls">
          <span class="window-dot red"></span>
          <span class="window-dot yellow"></span>
          <span class="window-dot green"></span>
        </div>
        <span class="window-title">Settings</span>
        <div style="width: 50px;"></div>
      </div>
      <div class="window-body">
        <div class="form-group">
          <label>主题</label>
          <input type="text" placeholder="校园、奇幻、日常...">
        </div>

        <div class="form-group">
          <label>角色</label>
          <input type="text" placeholder="角色的外观和性格特征">
        </div>

        <div class="form-group">
          <label>剧情</label>
          <textarea placeholder="用简短的话描述剧情..."></textarea>
        </div>

        <div class="form-group">
          <label>画风</label>
          <div class="radio-group">
            <div class="radio-option selected">3D MMD</div>
            <div class="radio-option">Chibi</div>
            <div class="radio-option">Papercut</div>
            <div class="radio-option">Clay</div>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary">生成</button>
          <button class="btn btn-secondary">重置</button>
        </div>
      </div>
    </div>

    <!-- Characters Window -->
    <div class="window window-characters">
      <div class="window-header">
        <div class="window-controls">
          <span class="window-dot red"></span>
          <span class="window-dot yellow"></span>
          <span class="window-dot green"></span>
        </div>
        <span class="window-title">角色</span>
        <div style="width: 50px;"></div>
      </div>
      <div class="window-body">
        <div class="char-list">
          <div class="char-item">
            <div class="char-avatar c1"></div>
            <div class="char-info">
              <div class="char-name">小明</div>
              <div class="char-desc">活泼的高中生</div>
            </div>
          </div>
          <div class="char-item">
            <div class="char-avatar c2"></div>
            <div class="char-info">
              <div class="char-name">小红</div>
              <div class="char-desc">温柔的青梅竹马</div>
            </div>
          </div>
          <div class="char-item">
            <div class="char-avatar c3"></div>
            <div class="char-info">
              <div class="char-name">老师</div>
              <div class="char-desc">严格的班主任</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Timeline Window -->
    <div class="window window-timeline">
      <div class="window-header">
        <div class="window-controls">
          <span class="window-dot red"></span>
          <span class="window-dot yellow"></span>
          <span class="window-dot green"></span>
        </div>
        <span class="window-title">Timeline</span>
        <div style="width: 50px;"></div>
      </div>
      <div class="window-body">
        <div class="timeline-header">
          <span class="timeline-title">漫画进度</span>
          <div class="timeline-actions">
            <button class="icon-btn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </button>
            <button class="icon-btn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </button>
          </div>
        </div>
        <div class="timeline-track">
          <div class="timeline-item done active">
            <span class="panel-num">1</span>
          </div>
          <div class="timeline-item done">
            <span class="panel-num">2</span>
          </div>
          <div class="timeline-item">
            <span class="panel-num">3</span>
          </div>
          <div class="timeline-item">
            <span class="panel-num">4</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Dock -->
    <div class="dock">
      <div class="dock-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </div>
      <div class="dock-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="dock-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
      </div>
      <div class="dock-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
    </div>
  </div>

  <script>
    // Radio selection
    document.querySelectorAll('.radio-option').forEach(opt => {
      opt.addEventListener('click', function() {
        document.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
      });
    });

    // Dock selection
    document.querySelectorAll('.dock-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Timeline selection
    document.querySelectorAll('.timeline-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.timeline-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Make windows draggable
    const windows = document.querySelectorAll('.window');
    windows.forEach(win => {
      const header = win.querySelector('.window-header');
      let isDragging = false;
      let startX, startY, initialX, initialY;

      header.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialX = win.offsetLeft;
        initialY = win.offsetTop;
        win.style.transition = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        win.style.left = initialX + dx + 'px';
        win.style.top = initialY + dy + 'px';
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
        win.style.transition = '';
      });
    });

    // Progress animation
    let progress = 0;
    const progressBar = document.querySelector('.progress-bar');
    const progressValue = document.querySelector('.progress-value');

    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 3;
        if (progress > 100) progress = 100;
        progressBar.style.width = progress + '%';
        progressValue.textContent = Math.floor(progress / 25) + 1 + '/4 panels';
      }
    }, 300);
  </script>
</body>
</html>
