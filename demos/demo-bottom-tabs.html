<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 底部标签布局</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: #0d1117;
      min-height: 100vh;
      color: #e6edf3;
      line-height: 1.5;
    }

    /* Mobile-first Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #161b22;
      position: relative;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      position: sticky;
      top: 0;
      background: #161b22;
      z-index: 10;
    }

    .logo {
      font-size: 1.125rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #21262d;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: #30363d;
      color: #e6edf3;
    }

    /* Tab Bar */
    .tab-bar {
      display: flex;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 8px 16px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      justify-content: space-around;
      z-index: 20;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #8b949e;
      flex: 1;
    }

    .tab-item:hover {
      background: #21262d;
    }

    .tab-item.active {
      color: #58a6ff;
    }

    .tab-item.active svg {
      filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.4));
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-label {
      font-size: 0.625rem;
      font-weight: 500;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 20px;
      padding-bottom: 80px;
    }

    /* Story Cards */
    .story-card {
      background: #21262d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #30363d;
    }

    .story-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .story-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      border-radius: 10px;
    }

    .story-info {
      flex: 1;
    }

    .story-title {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .story-meta {
      font-size: 0.6875rem;
      color: #8b949e;
    }

    /* Comic Grid */
    .comic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .comic-panel {
      aspect-ratio: 1;
      background: #0d1117;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .comic-panel:hover {
      transform: scale(1.02);
    }

    .panel-number {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 0.625rem;
      font-weight: 600;
      color: #484f58;
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Dialog */
    .dialog {
      position: absolute;
      background: #f0f6fc;
      color: #0d1117;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.6875rem;
      max-width: 80%;
    }

    .dialog-left {
      left: 8px;
      top: 25%;
    }

    .dialog-right {
      right: 8px;
      bottom: 25%;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
      transition: all 0.2s ease;
      z-index: 15;
    }

    .fab:hover {
      transform: scale(1.1);
    }

    .fab svg {
      width: 24px;
      height: 24px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 30;
      padding-bottom: 80px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #21262d;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: #21262d;
    }

    .modal-title {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #30363d;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 20px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 0.9375rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
      background: #161b22;
    }

    textarea {
      min-height: 100px;
      resize: none;
    }

    /* Radio Pills */
    .radio-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .radio-pill {
      padding: 10px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 20px;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-pill:hover {
      border-color: #58a6ff;
    }

    .radio-pill.selected {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }

    .btn {
      padding: 16px 24px;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
      color: #fff;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Progress */
    .progress-section {
      margin-top: 20px;
      padding: 16px;
      background: #0d1117;
      border-radius: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-label {
      font-size: 0.8125rem;
      color: #8b949e;
    }

    .progress-value {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #58a6ff;
    }

    .progress-track {
      height: 6px;
      background: #30363d;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #58a6ff 0%, #1f6feb 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: #21262d;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.6875rem;
      color: #8b949e;
      text-transform: uppercase;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      background: #21262d;
      border-radius: 20px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: #484f58;
    }

    .empty-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 0.8125rem;
      color: #8b949e;
      margin-bottom: 20px;
    }

    /* Section */
    .section {
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #8b949e;
    }

    .section-action {
      font-size: 0.75rem;
      color: #58a6ff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">Auto Yon Koma</div>
      <div class="header-actions">
        <button class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </button>
        <button class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value">12</div>
          <div class="stat-label">作品数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">48</div>
          <div class="stat-label">生成格数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">256</div>
          <div class="stat-label">活跃角色</div>
        </div>
      </div>

      <!-- Current Project -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">当前项目</span>
          <span class="section-action">查看全部</span>
        </div>

        <div class="story-card">
          <div class="story-header">
            <div class="story-avatar"></div>
            <div class="story-info">
              <div class="story-title">校园日常 - 第三章</div>
              <div class="story-meta">今天 14:30 · 进行中</div>
            </div>
            <button class="icon-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
              </svg>
            </button>
          </div>

          <div class="comic-grid">
            <div class="comic-panel">
              <span class="panel-number">01</span>
              <div class="dialog dialog-left">你好</div>
            </div>
            <div class="comic-panel">
              <span class="panel-number">02</span>
              <div class="dialog dialog-right">欢迎</div>
            </div>
            <div class="comic-panel">
              <span class="panel-number">03</span>
            </div>
            <div class="comic-panel">
              <span class="panel-number">04</span>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-header">
              <span class="progress-label">生成进度</span>
              <span class="progress-value">2/4 panels</span>
            </div>
            <div class="progress-track">
              <div class="progress-bar" style="width: 50%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">最近项目</span>
          <span class="section-action">查看全部</span>
        </div>

        <div class="story-card">
          <div class="story-header">
            <div class="story-avatar" style="background: linear-gradient(135deg, #f85149 0%, #da3633 100%);"></div>
            <div class="story-info">
              <div class="story-title">奇幻冒险 - 第一集</div>
              <div class="story-meta">昨天 · 已完成</div>
            </div>
          </div>
        </div>

        <div class="story-card">
          <div class="story-header">
            <div class="story-avatar" style="background: linear-gradient(135deg, #a371f7 0%, #8957e5 100%);"></div>
            <div class="story-info">
              <div class="story-title">搞笑日常</div>
              <div class="story-meta">3天前 · 已完成</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- FAB -->
    <button class="fab" id="fabBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="tab-label">首页</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span class="tab-label">项目</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="tab-label">角色</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="tab-label">设置</span>
      </div>
    </nav>

    <!-- Create Modal -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">新建项目</h2>
          <button class="modal-close" id="modalClose">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>主题</label>
            <input type="text" placeholder="校园、奇幻、日常...">
          </div>

          <div class="form-group">
            <label>角色</label>
            <input type="text" placeholder="角色的外观和性格特征">
          </div>

          <div class="form-group">
            <label>剧情</label>
            <textarea placeholder="用简短的话描述剧情..."></textarea>
          </div>

          <div class="form-group">
            <label>画风</label>
            <div class="radio-pills">
              <div class="radio-pill selected">3D MMD</div>
              <div class="radio-pill">Chibi</div>
              <div class="radio-pill">Papercut</div>
              <div class="radio-pill">Clay</div>
            </div>
          </div>

          <button class="btn btn-primary">开始生成</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab selection
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Radio pills
    document.querySelectorAll('.radio-pill').forEach(pill => {
      pill.addEventListener('click', function() {
        document.querySelectorAll('.radio-pill').forEach(p => p.classList.remove('selected'));
        this.classList.add('selected');
      });
    });

    // Modal
    const modal = document.getElementById('modal');
    const fabBtn = document.getElementById('fabBtn');
    const modalClose = document.getElementById('modalClose');

    fabBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    modalClose.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    // Progress animation
    let progress = 0;
    const progressBar = document.querySelector('.progress-bar');
    const progressValue = document.querySelector('.progress-value');

    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 3;
        if (progress > 100) progress = 100;
        progressBar.style.width = progress + '%';
        progressValue.textContent = Math.floor(progress / 25) + 1 + '/4 panels';
      }
    }, 300);
  </script>
</body>
</html>
