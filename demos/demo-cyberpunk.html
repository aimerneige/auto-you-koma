<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 赛博朋克</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Cyberpunk Background */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px),
        linear-gradient(rgba(255,0,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    .glow-line {
      position: fixed;
      height: 2px;
      background: linear-gradient(90deg, transparent, #0ff, #f0f, transparent);
      width: 100%;
      animation: scanLine 4s linear infinite;
      z-index: 1;
    }

    @keyframes scanLine {
      0% { top: 0; opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #0ff, #f0f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(0,255,255,0.5);
      letter-spacing: 4px;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
      96% { opacity: 0.9; }
      97% { opacity: 1; }
    }

    .tagline {
      font-size: 1rem;
      color: #888;
      margin-top: 10px;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    /* Steps */
    .steps {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 25px;
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .step:hover {
      background: rgba(0,255,255,0.1);
      border-color: #0ff;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    .step.active {
      background: rgba(0,255,255,0.15);
      border-color: #0ff;
      box-shadow: 0 0 30px rgba(0,255,255,0.4);
    }

    .step-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    .step-name {
      font-size: 0.9rem;
      color: #ccc;
    }

    .step-arrow {
      color: #f0f;
      font-size: 1.5rem;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Input Panel */
    .panel {
      background: rgba(15,15,25,0.9);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 8px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #0ff, #f0f);
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: #0ff;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title::before {
      content: '//';
      color: #f0f;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    input, textarea, select {
      width: 100%;
      padding: 15px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Noto Sans SC', sans-serif;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0ff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    select {
      cursor: pointer;
    }

    option {
      background: #0a0a0f;
    }

    /* Buttons */
    .btn {
      padding: 15px 40px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ff, #00a0a0);
      color: #000;
      box-shadow: 0 0 20px rgba(0,255,255,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0,255,255,0.6);
    }

    .btn-secondary {
      background: transparent;
      color: #f0f;
      border: 1px solid #f0f;
    }

    .btn-secondary:hover {
      background: rgba(255,0,255,0.1);
      box-shadow: 0 0 20px rgba(255,0,255,0.3);
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    /* Preview Panel */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .comic-panel {
      aspect-ratio: 9/16;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0,255,255,0.2);
    }

    .comic-panel.empty {
      border: 2px dashed rgba(0,255,255,0.3);
    }

    .comic-panel.empty::after {
      content: '+';
      font-size: 3rem;
      color: rgba(0,255,255,0.3);
    }

    .panel-label {
      position: absolute;
      top: 8px;
      left: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      color: #0ff;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      border-radius: 3px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      margin-top: 20px;
    }

    .status-text {
      font-size: 0.85rem;
      color: #0ff;
    }

    .progress {
      width: 200px;
      height: 4px;
      background: rgba(0,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0ff, #f0f);
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Floating Elements */
    .float-element {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      color: rgba(0,255,255,0.5);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .float-1 { top: 100px; left: 10%; animation-delay: 0s; }
    .float-2 { top: 200px; right: 5%; animation-delay: 1s; }
    .float-3 { bottom: 150px; left: 8%; animation-delay: 2s; }

    /* Loading Animation */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .loading span {
      width: 8px;
      height: 8px;
      background: #0ff;
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .loading span:nth-child(1) { animation-delay: -0.32s; }
    .loading span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Comic bubble style */
    .bubble {
      position: absolute;
      background: rgba(255,255,255,0.95);
      color: #000;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 0.8rem;
      max-width: 80%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .bubble-left {
      left: 10%;
      top: 30%;
    }

    .bubble-right {
      right: 10%;
      bottom: 30%;
    }

    .bubble::after {
      content: '';
      position: absolute;
      border: 8px solid transparent;
    }

    .bubble-left::after {
      left: -16px;
      border-right-color: rgba(255,255,255,0.95);
      border-left: 0;
    }

    .bubble-right::after {
      right: -16px;
      border-left-color: rgba(255,255,255,0.95);
      border-right: 0;
    }

    /* Style Selector */
    .style-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .style-option {
      flex: 1;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.8rem;
    }

    .style-option:hover, .style-option.selected {
      background: rgba(0,255,255,0.1);
      border-color: #0ff;
    }

    .style-option.selected {
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-line"></div>

  <div class="float-element float-1">SYSTEM ONLINE</div>
  <div class="float-element float-2">NEURAL LINK</div>
  <div class="float-element float-3">V.2.0.25</div>

  <div class="container">
    <header>
      <h1 class="logo">AUTO YON KOMA</h1>
      <p class="tagline">Cyberpunk Edition</p>
    </header>

    <div class="steps">
      <div class="step active">
        <span class="step-num">01</span>
        <span class="step-name">IDEATION</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">02</span>
        <span class="step-name">STORYBOARD</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">03</span>
        <span class="step-name">RENDER</span>
      </div>
      <span class="step-arrow">→</span>
      <div class="step">
        <span class="step-num">04</span>
        <span class="step-name">EXPORT</span>
      </div>
    </div>

    <div class="main-content">
      <div class="panel input-panel">
        <h2 class="panel-title">输入故事设定</h2>

        <div class="form-group">
          <label>故事主题</label>
          <input type="text" placeholder="例如：赛博朋克校园、异世界转生...">
        </div>

        <div class="form-group">
          <label>角色设定</label>
          <input type="text" placeholder="例如：傲娇双马尾学妹、温柔社恐学长...">
        </div>

        <div class="form-group">
          <label>剧情简述</label>
          <textarea placeholder="用一两句话描述核心剧情点..."></textarea>
        </div>

        <div class="form-group">
          <label>画风选择</label>
          <div class="style-selector">
            <div class="style-option selected">3D MMD</div>
            <div class="style-option">Chibi</div>
            <div class="style-option">Papercraft</div>
            <div class="style-option">Claymotion</div>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary">生成漫画</button>
          <button class="btn btn-secondary">重置</button>
        </div>
      </div>

      <div class="panel preview-panel">
        <h2 class="panel-title">实时预览</h2>

        <div class="preview-grid">
          <div class="comic-panel">
            <span class="panel-label">01</span>
            <div class="bubble bubble-left">你好呀！</div>
          </div>
          <div class="comic-panel">
            <span class="panel-label">02</span>
            <div class="bubble bubble-right">早上好~</div>
          </div>
          <div class="comic-panel">
            <span class="panel-label">03</span>
          </div>
          <div class="comic-panel empty">
            <span class="panel-label">04</span>
          </div>
        </div>

        <div class="status-bar">
          <div class="status-text">
            <span class="loading">
              <span></span>
              <span></span>
              <span></span>
            </span>
            正在生成第 3 格...
          </div>
          <div class="progress">
            <div class="progress-bar" style="width: 65%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Interactive style selector
    document.querySelectorAll('.style-option').forEach(option => {
      option.addEventListener('click', function() {
        document.querySelectorAll('.style-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
      });
    });

    // Button hover effect
    document.querySelector('.btn-primary').addEventListener('mouseenter', function() {
      this.style.transform = 'translateY(-2px)';
    });

    // Progress bar animation simulation
    let progress = 0;
    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 5;
        if (progress > 100) progress = 100;
        document.querySelector('.progress-bar').style.width = progress + '%';
      }
    }, 500);
  </script>
</body>
</html>
