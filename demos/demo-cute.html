<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 日式可爱</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Nunito:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fff5f8 0%, #ffeef5 50%, #fff0f7 100%);
      min-height: 100vh;
      color: #5a4a5a;
      overflow-x: hidden;
    }

    /* Cute Background Pattern */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.4;
      background-image:
        radial-gradient(circle at 20% 30%, #ffcce0 0%, transparent 8%),
        radial-gradient(circle at 80% 70%, #cce0ff 0%, transparent 8%),
        radial-gradient(circle at 50% 50%, #ccffcc 0%, transparent 6%);
      background-size: 100px 100px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(180deg, #ff6b9d, #c84b8b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0px #ffd6e7;
    }

    .tagline {
      font-size: 1.1rem;
      color: #b88a9c;
      margin-top: 8px;
      font-weight: 500;
    }

    /* Decorative Elements */
    .deco {
      position: absolute;
      font-size: 2rem;
      animation: bounce 2s ease-in-out infinite;
    }

    .deco-1 { top: 20px; left: 5%; animation-delay: 0s; }
    .deco-2 { top: 80px; right: 8%; animation-delay: 0.5s; }
    .deco-3 { bottom: 120px; left: 3%; animation-delay: 1s; }
    .deco-4 { bottom: 60px; right: 5%; animation-delay: 1.5s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(10deg); }
    }

    /* Steps */
    .steps {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border: 3px solid #ffcce0;
      border-radius: 25px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255,107,157,0.15);
    }

    .step:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255,107,157,0.25);
    }

    .step.active {
      background: linear-gradient(135deg, #ff9ec4, #ff7aa2);
      border-color: #ff7aa2;
      color: #fff;
    }

    .step-num {
      width: 28px;
      height: 28px;
      background: #ffcce0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .step.active .step-num {
      background: rgba(255,255,255,0.3);
    }

    .step-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Panels */
    .panel {
      background: #fff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(255,107,157,0.15);
      border: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .panel:hover {
      border-color: #ffcce0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px dashed #ffe5f0;
    }

    .panel-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff9ec4, #ff7aa2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .panel-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #c84b8b;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #b88a9c;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px 18px;
      background: #fff9fb;
      border: 2px solid #ffe5f0;
      border-radius: 16px;
      color: #5a4a5a;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #ff7aa2;
      box-shadow: 0 0 0 4px rgba(255,122,162,0.15);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select {
      cursor: pointer;
    }

    /* Cute Buttons */
    .btn {
      padding: 14px 35px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff9ec4, #ff7aa2);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255,122,162,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255,122,162,0.5);
    }

    .btn-secondary {
      background: #fff;
      color: #c84b8b;
      border: 2px solid #ffcce0;
    }

    .btn-secondary:hover {
      background: #fff5f8;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    /* Style Tags */
    .style-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .style-tag {
      padding: 8px 16px;
      background: #fff5f8;
      border: 2px solid #ffe5f0;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .style-tag:hover {
      border-color: #ff9ec4;
    }

    .style-tag.selected {
      background: linear-gradient(135deg, #ff9ec4, #ff7aa2);
      color: #fff;
      border-color: #ff7aa2;
    }

    /* Preview Grid */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .comic-panel {
      aspect-ratio: 9/16;
      background: linear-gradient(145deg, #fff0f5, #ffe5f0);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 3px solid #ffe5f0;
      transition: all 0.3s ease;
    }

    .comic-panel:hover {
      border-color: #ff9ec4;
      transform: scale(1.02);
    }

    .panel-label {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #c84b8b;
      background: rgba(255,255,255,0.9);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Cute Bubbles */
    .bubble {
      position: absolute;
      background: #fff;
      color: #5a4a5a;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      max-width: 85%;
      box-shadow: 0 4px 15px rgba(200,75,139,0.15);
      border: 2px solid #ffcce0;
    }

    .bubble-left {
      left: 8%;
      top: 25%;
    }

    .bubble-right {
      right: 8%;
      bottom: 25%;
    }

    .bubble::after {
      content: '';
      position: absolute;
      border: 10px solid transparent;
    }

    .bubble-left::after {
      left: -20px;
      border-right-color: #ffcce0;
      border-left: 0;
      top: 15px;
    }

    .bubble-right::after {
      right: -20px;
      border-left-color: #ffcce0;
      border-right: 0;
      bottom: 15px;
    }

    /* Status Card */
    .status-card {
      background: linear-gradient(135deg, #fff5f8, #ffe5f0);
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .heart {
      color: #ff6b9d;
      animation: heartbeat 1s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .status-text {
      font-size: 0.9rem;
      color: #c84b8b;
      font-weight: 600;
    }

    .cute-progress {
      width: 150px;
      height: 10px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ffcce0;
    }

    .cute-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff9ec4, #ff7aa2);
      border-radius: 8px;
      transition: width 0.5s ease;
    }

    /* Floating sparkles */
    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffd700;
      border-radius: 50%;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* Empty panel decoration */
    .comic-panel.empty::before {
      content: '✦';
      font-size: 2.5rem;
      color: #ffcce0;
    }

    /* Panel edit button */
    .panel-edit {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.9);
      border: 2px solid #ffcce0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      font-size: 0.8rem;
    }

    .comic-panel:hover .panel-edit {
      opacity: 1;
    }

    .panel-edit:hover {
      background: #ff7aa2;
      color: #fff;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .steps {
        gap: 8px;
      }

      .step {
        padding: 10px 14px;
      }

      .step-name {
        display: none;
      }

      .logo {
        font-size: 2rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="deco deco-1">✿</div>
  <div class="deco deco-2">★</div>
  <div class="deco deco-3">♡</div>
  <div class="deco deco-4">✾</div>

  <div class="container">
    <header>
      <h1 class="logo">✿ Auto Yon Koma ✿</h1>
      <p class="tagline">~ 萌系四格漫画生成器 ~</p>
    </header>

    <div class="steps">
      <div class="step active">
        <span class="step-num">1</span>
        <span class="step-name">构思</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span class="step-name">分镜</span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span class="step-name">出图</span>
      </div>
      <div class="step">
        <span class="step-num">4</span>
        <span class="step-name">完成</span>
      </div>
    </div>

    <div class="main-content">
      <div class="panel input-panel">
        <div class="panel-header">
          <div class="panel-icon">✏️</div>
          <h2 class="panel-title">输入你的故事</h2>
        </div>

        <div class="form-group">
          <label>故事主题</label>
          <input type="text" placeholder="例如：校园日常、奇幻冒险...">
        </div>

        <div class="form-group">
          <label>可爱的主角们</label>
          <input type="text" placeholder="例如：活泼双马尾少女、温柔大哥哥...">
        </div>

        <div class="form-group">
          <label>发生了什么呀？</label>
          <textarea placeholder="简单描述一下剧情吧~"></textarea>
        </div>

        <div class="form-group">
          <label>喜欢什么画风呢？</label>
          <div class="style-tags">
            <span class="style-tag selected">3D MMD</span>
            <span class="style-tag">Q版人偶</span>
            <span class="style-tag">粘土手办</span>
            <span class="style-tag">折纸风</span>
            <span class="style-tag">复古胶片</span>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary">✨ 开始生成</button>
          <button class="btn btn-secondary">↺ 重置</button>
        </div>
      </div>

      <div class="panel preview-panel">
        <div class="panel-header">
          <div class="panel-icon">🎀</div>
          <h2 class="panel-title">预览区域</h2>
        </div>

        <div class="preview-grid">
          <div class="comic-panel">
            <span class="panel-label">第 1 格</span>
            <div class="bubble bubble-left">好痒呀~ ♪</div>
            <span class="panel-edit">✎</span>
          </div>
          <div class="comic-panel">
            <span class="panel-label">第 2 格</span>
            <div class="bubble bubble-right">嘿嘿~</div>
            <span class="panel-edit">✎</span>
          </div>
          <div class="comic-panel">
            <span class="panel-label">第 3 格</span>
            <span class="panel-edit">✎</span>
          </div>
          <div class="comic-panel empty">
            <span class="panel-label">第 4 格</span>
            <span class="panel-edit">✎</span>
          </div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="heart">♥</span>
            <span class="status-text">正在生成第 3 格...</span>
          </div>
          <div class="cute-progress">
            <div class="cute-progress-bar" style="width: 60%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Style tag selection
    document.querySelectorAll('.style-tag').forEach(tag => {
      tag.addEventListener('click', function() {
        document.querySelectorAll('.style-tag').forEach(t => t.classList.remove('selected'));
        this.classList.add('selected');
      });
    });

    // Panel edit button click
    document.querySelectorAll('.panel-edit').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        alert('点击了编辑按钮，可以修改这一格的内容~');
      });
    });

    // Progress animation
    let progress = 0;
    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 4;
        if (progress > 100) progress = 100;
        document.querySelector('.cute-progress-bar').style.width = progress + '%';
      }
    }, 400);
  </script>
</body>
</html>
