<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Yon Koma - 复古怀旧</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: #2d1b4e;
      min-height: 100vh;
      color: #f0e6d3;
      position: relative;
      overflow-x: hidden;
    }

    /* Vintage TV Effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.1) 0px,
          rgba(0,0,0,0.1) 1px,
          transparent 1px,
          transparent 3px
        );
      pointer-events: none;
      z-index: 1000;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
      z-index: 999;
    }

    /* Background */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at top left, #4a2c7a 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #6b3fa0 0%, transparent 50%),
        linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Header - Retro TV Style */
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
      background: linear-gradient(180deg, #1a0f2e 0%, #2d1b4e 100%);
      border: 3px solid #ffd700;
      border-radius: 12px;
      box-shadow:
        0 0 0 3px #4a2c7a,
        0 0 20px rgba(255,215,0,0.3),
        inset 0 0 30px rgba(255,215,0,0.1);
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow:
        2px 2px 0 #c9a300,
        -1px -1px 0 #fff9c4;
      letter-spacing: 4px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 2px 2px 0 #c9a300, 0 0 10px rgba(255,215,0,0.5); }
      to { text-shadow: 2px 2px 0 #c9a300, 0 0 20px rgba(255,215,0,0.8); }
    }

    .tagline {
      font-size: 0.95rem;
      color: #d4b896;
      margin-top: 8px;
      letter-spacing: 2px;
    }

    /* Retro Buttons Navigation */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 24px;
      background: #1a0f2e;
      border: 2px solid #ffd700;
      color: #ffd700;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab:first-child {
      border-radius: 8px 0 0 8px;
    }

    .tab:last-child {
      border-radius: 0 8px 8px 0;
    }

    .tab:hover {
      background: #3d2563;
    }

    .tab.active {
      background: #ffd700;
      color: #1a0f2e;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #ffd700;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Panels */
    .panel {
      background: linear-gradient(145deg, #3d2563, #2d1b4e);
      border: 3px solid #ffd700;
      border-radius: 12px;
      padding: 25px;
      box-shadow:
        inset 0 0 20px rgba(0,0,0,0.3),
        0 8px 25px rgba(0,0,0,0.4);
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #6b3fa0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title::before {
      content: '◆';
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #d4b896;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      background: #1a0f2e;
      border: 2px solid #6b3fa0;
      border-radius: 6px;
      color: #f0e6d3;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* Retro Checkbox */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #1a0f2e;
      border: 2px solid #6b3fa0;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .checkbox-label:hover {
      border-color: #9b7fc0;
    }

    .checkbox-label.selected {
      background: #ffd700;
      border-color: #ffd700;
      color: #1a0f2e;
    }

    .checkbox-label input {
      display: none;
    }

    /* Buttons */
    .btn {
      padding: 12px 30px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(180deg, #ffd700, #c9a300);
      color: #1a0f2e;
      box-shadow:
        0 4px 0 #8a7000,
        0 6px 10px rgba(0,0,0,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 6px 0 #8a7000,
        0 10px 15px rgba(0,0,0,0.3);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #8a7000,
        0 3px 5px rgba(0,0,0,0.3);
    }

    .btn-secondary {
      background: transparent;
      color: #d4b896;
      border: 2px solid #6b3fa0;
    }

    .btn-secondary:hover {
      background: #3d2563;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* Comic Panels */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .comic-panel {
      aspect-ratio: 9/16;
      background: linear-gradient(180deg, #4a2c7a, #2d1b4e);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 2px solid #6b3fa0;
      transition: all 0.2s ease;
    }

    .comic-panel:hover {
      border-color: #ffd700;
    }

    .panel-num {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 0.75rem;
      color: #ffd700;
      background: rgba(26,15,46,0.8);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* Speech Bubbles - Retro Style */
    .bubble {
      position: absolute;
      background: #fff;
      color: #1a0f2e;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.75rem;
      max-width: 85%;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }

    .bubble-left {
      left: 8%;
      top: 25%;
    }

    .bubble-left::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 10px;
      border: 8px solid transparent;
      border-right-color: #fff;
      border-left: 0;
    }

    .bubble-right {
      right: 8%;
      bottom: 25%;
    }

    .bubble-right::before {
      content: '';
      position: absolute;
      right: -10px;
      bottom: 10px;
      border: 8px solid transparent;
      border-left-color: #fff;
      border-right: 0;
    }

    /* Progress */
    .status-box {
      margin-top: 20px;
      padding: 15px;
      background: #1a0f2e;
      border: 2px solid #6b3fa0;
      border-radius: 8px;
    }

    .status-text {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #d4b896;
      margin-bottom: 10px;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .progress-bar-container {
      height: 8px;
      background: #2d1b4e;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6b3fa0, #ffd700);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Decorative Corners */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #ffd700;
    }

    .corner-tl { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .corner-tr { top: -3px; right: -3px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
    .corner-bl { bottom: -3px; left: -3px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
    .corner-br { bottom: -3px; right: -3px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }

    /* Loading dots */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .nav-tabs {
        gap: 0;
      }

      .tab {
        padding: 10px 16px;
        font-size: 0.8rem;
      }

      .logo {
        font-size: 1.6rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <header>
      <h1 class="logo">✦ AUTO YON KOMA ✦</h1>
      <p class="tagline">～ 90年代アニメ風 四コマジェネレーター ～</p>
    </header>

    <div class="nav-tabs">
      <button class="tab active">STEP 1: アイデア</button>
      <button class="tab">STEP 2: シナリオ</button>
      <button class="tab">STEP 3: 画像生成</button>
      <button class="tab">STEP 4: 完成</button>
    </div>

    <div class="main-content">
      <div class="panel input-panel">
        <h2 class="panel-title">故事設定を入力</h2>

        <div class="form-group">
          <label>テーマ / テーマ</label>
          <input type="text" placeholder="例を：学園ファンタジー、日常...">
        </div>

        <div class="form-group">
          <label>キャラクター / 角色</label>
          <input type="text" placeholder="外見と性格の特徴">
        </div>

        <div class="form-group">
          <label>ストーリー / 剧情</label>
          <textarea placeholder="簡単なストーリーを入力..."></textarea>
        </div>

        <div class="form-group">
          <label>アートスタイル / 画風</label>
          <div class="checkbox-group">
            <label class="checkbox-label selected">
              <input type="checkbox" checked> 3D MMD
            </label>
            <label class="checkbox-label">
              <input type="checkbox"> ちびキャラ
            </label>
            <label class="checkbox-label">
              <input type="checkbox"> ペーパークラフト
            </label>
            <label class="checkbox-label">
              <input type="checkbox"> クレイ
            </label>
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary">生成する</button>
          <button class="btn btn-secondary">リセット</button>
        </div>
      </div>

      <div class="panel preview-panel">
        <h2 class="panel-title">プレビュー</h2>

        <div class="preview-grid">
          <div class="comic-panel">
            <span class="panel-num">第1格</span>
            <div class="bubble bubble-left">こんにちは！</div>
          </div>
          <div class="comic-panel">
            <span class="panel-num">第2格</span>
            <div class="bubble bubble-right">おはよう♪</div>
          </div>
          <div class="comic-panel">
            <span class="panel-num">第3格</span>
          </div>
          <div class="comic-panel">
            <span class="panel-num">第4格</span>
          </div>
        </div>

        <div class="status-box">
          <div class="status-text">
            <span class="blink">●</span>
            <span class="loading-dots">現在、第3格を生成中</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: 65%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Checkbox styling
    document.querySelectorAll('.checkbox-label').forEach(label => {
      label.addEventListener('click', function() {
        const checkbox = this.querySelector('input');
        checkbox.checked = !checkbox.checked;
        this.classList.toggle('selected', checkbox.checked);
      });
    });

    // Progress animation
    let progress = 0;
    setInterval(() => {
      if (progress < 100) {
        progress += Math.random() * 4;
        if (progress > 100) progress = 100;
        document.querySelector('.progress-bar-fill').style.width = progress + '%';
      }
    }, 350);
  </script>
</body>
</html>
